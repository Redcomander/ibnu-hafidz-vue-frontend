name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-cpanel-main
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/frontend-tests.yml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.CPANEL_FRONTEND_REPO_PATH }}"
            git fetch origin main
            # Never publish an older run after main has advanced.
            if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
              echo "Skipping deployment: main has advanced beyond the tested commit."
              exit 0
            fi
            git reset --hard "${{ github.sha }}"
            /bin/bash deploy/cpanel/deploy.sh
